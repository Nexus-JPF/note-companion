name: Obsidian review lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  obsidian-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint like Obsidian community review
        run: pnpm lint:obsidian-scan

      - name: Lint plugin CSS (shipped bundle)
        run: pnpm lint:css

      - name: Build like Obsidian community review
        run: pnpm build
