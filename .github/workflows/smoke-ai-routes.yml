name: Smoke test AI routes

# Live check that the AI routes the plugin depends on still work with the
# deployed model/provider config. A failed run means a route is returning an
# error (see the job log for the route and the server's message).
#
# Runs after each production deploy of the web app (code or env var changes only
# take effect through a deploy), plus once a day as a backstop for provider-side
# changes that happen without a deploy (model deprecation, key or quota issues).
on:
  deployment_status:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to test (default: production; only app.notecompanion.ai, localhost and our Vercel previews are allowed)"
        required: false
        default: ""
      only:
        description: "Comma-separated route names to run (default: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    # deployment_status fires for every Vercel project and environment; only run
    # for a successful production deploy of the web app (not previews or landing).
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production – note-companion')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # Vercel reports success when the build finishes; give the alias a moment
      # to switch to the new deployment so we don't test the previous one.
      - name: Wait for the new deployment to serve traffic
        if: github.event_name == 'deployment_status'
        run: sleep 60

      - name: Run smoke test
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ONLY: ${{ inputs.only }}
        run: node packages/web/scripts/smoke-ai-routes.mjs
